[project]
name = "proofmark"
version = "0.1.0"
description = "Highlight anything on your Mac, get it fact-checked with Tavily + NVIDIA Nemotron on Nebius Token Factory"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
]

[tool.setuptools.package-data]
proofmark = ["static/*"]
