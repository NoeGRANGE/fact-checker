<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Same world as the Mac panel: dark paper, highlighter inks, mono margin notes */
:root{
  --paper:#111216; --sheet:#191a20; --fg:#ecebe6; --muted:#8d8e98; --line:#2a2b33;
  --pending:#ffe14d; --true:#7cf29a; --mostly_true:#c7f26b; --misleading:#ffd13f; --false:#ff70a3; --unverifiable:#c2c2d6;
  --serif:"Newsreader",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--fg);font:15px/1.55 var(--sans);
  padding:48px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mono{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px}
.brand i{width:16px;height:9px;border-radius:2px;background:var(--pending);transform:rotate(-8deg)}
h1{font:400 clamp(30px,6vw,44px)/1.1 var(--serif);margin:0;text-wrap:balance}
.mk{background:linear-gradient(var(--ink,var(--pending)),var(--ink,var(--pending))) no-repeat 0 60%/0% 78%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .7s cubic-bezier(.6,0,.2,1);color:inherit}
.mk.on{background-size:100% 78%;color:#111}
h1 .mk{background-size:100% 78%;color:#111;padding:0 .1em}
textarea{width:100%;min-height:110px;background:var(--sheet);color:var(--fg);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font:17px/1.5 var(--serif);resize:vertical}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--pending);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;border-radius:10px;border:1px solid var(--line);
  background:var(--sheet);color:var(--fg);padding:10px 14px;cursor:pointer}
button.go{background:var(--pending);color:#111;border-color:var(--pending)}
button:disabled{opacity:.5;cursor:wait}
#out{display:flex;flex-direction:column;gap:22px}
.claim{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.ctext{font:19px/1.5 var(--serif)}
.ctext.wait .mk{background-size:100% 78%;--ink:rgba(255,225,77,.14);color:var(--fg);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.6}}
.verdict{display:flex;align-items:center;gap:12px;font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.ruler{display:flex;gap:3px;align-items:flex-end}
.ruler b{width:3px;height:8px;border-radius:2px;background:var(--line)}
.ruler b:nth-child(5n){height:12px}
.ruler b.f{background:var(--ink)}
.quote{display:grid;grid-template-columns:3px 1fr;gap:12px;text-decoration:none;color:inherit}
.quote::before{content:"";background:var(--ink);border-radius:3px}
.quote q{font:italic 15px/1.5 var(--serif)}
.trace{display:flex;flex-direction:column;gap:4px;font:500 11px var(--mono);color:var(--muted)}
.trace div{display:grid;grid-template-columns:auto 76px 1fr auto;gap:8px;align-items:center}
.trace div > *{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trace em{font-style:normal;background:var(--pending);color:#111;padding:1px 5px;border-radius:3px;font-weight:700;font-size:9.5px}
.err{color:var(--false)}
@media (prefers-reduced-motion:reduce){.mk{transition:none}.ctext.wait .mk{animation:none}}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i><span class="mono">Margin · web playground</span></div>
  <h1>Paste a claim. Get it <span class="mk">checked</span> with sources.</h1>
  <p style="color:var(--muted);margin:0">The Mac app does this from any app with ⌥Space. Same backend: Tavily searches both sides, NVIDIA Nemotron on Nebius Token Factory judges, and every quote is verified word for word against the source.</p>
  <textarea id="text" aria-label="Text to check">Humans only use 10% of their brain, according to neuroscientists.</textarea>
  <div class="row">
    <button class="go" id="go">Check it</button>
    <button data-ex="The Great Wall of China is the only man-made structure visible from space with the naked eye.">Example: Great Wall</button>
    <button data-ex="Mount Everest is the tallest mountain on Earth at 8,849 meters, and it grows about 4 millimeters each year.">Example: Everest</button>
  </div>
  <div id="out"></div>
  <div class="trace" id="trace" aria-live="polite"></div>
</main>
<script>
const $ = s => document.querySelector(s), out = $("#out"), trace = $("#trace"), go = $("#go");
const WORD = {true:"True",mostly_true:"Mostly true",misleading:"Misleading",false:"False",unverifiable:"Unverifiable"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { $("#text").value = b.dataset.ex; run(); });
go.onclick = run;

async function run() {
  const text = $("#text").value.trim();
  if (!text) return;
  go.disabled = true; out.innerHTML = `<div class="mono" id="status">Reading</div>`; trace.innerHTML = "";
  try {
    const res = await fetch("/check", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
    if (!res.ok) throw new Error((await res.json()).detail || `Server answered ${res.status}`);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += value;
      const parts = buf.split("\n\n"); buf = parts.pop();
      parts.filter(p => p.startsWith("data: ")).forEach(p => apply(JSON.parse(p.slice(6))));
    }
  } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  go.disabled = false;
}

function apply(ev) {
  const st = $("#status");
  if (ev.type === "status" && ev.claim == null && st) st.textContent = ev.text;
  if (ev.type === "status" && ev.claim != null) { const s = $(`#c${ev.claim} .mono`); if (s) s.textContent = ev.text; }
  if (ev.type === "error") out.innerHTML = `<p class="err">${esc(ev.message)}</p>`;
  if (ev.type === "claims") out.innerHTML = ev.claims.map(c =>
    `<section class="claim" id="c${c.id}"><div class="ctext wait"><span class="mk">${esc(c.text)}</span></div>
     <div class="mono">Searching both sides</div></section>`).join("") || `<p class="mono">No checkable claim found</p>`;
  if (ev.type === "sources") { const s = $(`#c${ev.claim} .mono`); if (s) s.textContent = `Reading sources · ${ev.sources.length} found`; }
  if (ev.type === "trace") trace.insertAdjacentHTML("beforeend",
    `<div><em>${esc(ev.endpoint)}</em><span>${esc(ev.label)}</span><span>${esc(ev.query)}</span><span>${ev.count} · ${ev.ms}ms</span></div>`);
  if (ev.type === "verdict") {
    const el = $(`#c${ev.claim}`), ink = `var(--${ev.label in WORD ? ev.label : "unverifiable"})`;
    el.style.setProperty("--ink", ink);
    const filled = Math.round(ev.confidence / 10);
    el.innerHTML = `<div class="ctext"><span class="mk">${esc(el.querySelector(".mk").textContent)}</span></div>
      <div class="verdict">${WORD[ev.label] || esc(ev.label)}<span class="ruler">${Array.from({length:10},(_, i) => `<b class="${i < filled ? "f" : ""}"></b>`).join("")}</span><span class="mono">${ev.confidence}</span></div>
      <p style="margin:0">${esc(ev.summary)}</p>
      ${ev.quotes.slice(0, 2).map(q => `<a class="quote" href="${esc(q.url)}" target="_blank" rel="noopener"><div><q>${esc(q.text)}</q>
        <div class="mono">${esc(q.domain)}${q.date ? " · " + esc(q.date.slice(0, 16)) : ""}</div></div></a>`).join("")}
      ${ev.rejected ? `<div class="mono">${ev.rejected} unverified quote${ev.rejected > 1 ? "s" : ""} dropped</div>` : ""}`;
    requestAnimationFrame(() => requestAnimationFrame(() => el.querySelector(".mk").classList.add("on")));
  }
  if (ev.type === "origin") $(`#c${ev.claim}`)?.insertAdjacentHTML("beforeend",
    `<a class="mono" href="${esc(ev.url)}" target="_blank" rel="noopener" style="color:var(--muted)">Earliest found · ${esc(ev.domain)} · ${esc(ev.date.slice(0, 16))}</a>`);
  if (ev.type === "done") trace.insertAdjacentHTML("afterbegin", `<div class="mono" style="display:block;margin-bottom:6px">${ev.tavily_calls} Tavily calls · ${(ev.ms / 1000).toFixed(1)}s${ev.cached ? " · cached" : ""}</div>`);
}
</script>
</body>
</html>
