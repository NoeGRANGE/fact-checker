<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23242c"/><stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
  <!-- notebook margin rule -->
  <line x1="318" y1="176" x2="318" y2="848" stroke="#ff70a3" stroke-width="10" stroke-linecap="round" opacity=".85"/>
